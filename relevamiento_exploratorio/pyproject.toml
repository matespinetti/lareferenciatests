[project]
name = "relevamiento"
version = "0.1.0"
description = "Relevamiento exploratorio de repositorios institucionales (DSpace, OJS, EPrints)"
authors = [
    { name = "mateospinetti", email = "mateospinetti1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "protego>=0.7.0",
    "typer>=0.27.3",
]

[project.scripts]
relevamiento = "relevamiento.cli:app"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "looptime>=0.9",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--looptime"]
testpaths = ["tests"]
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning"]
